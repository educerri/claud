<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caminhando pelo Circuito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>⚡ Caminhando pelo Circuito</h1>
      <div class="hud">
        <div class="hud-item"><span>Potencial</span><strong id="hud-pot">–</strong></div>
        <div class="hud-item"><span>Componentes</span><strong id="hud-visited">0/10</strong></div>
        <div class="hud-item"><span>Passos</span><strong id="hud-steps">0</strong></div>
        <div class="hud-item"><span>Malhas</span><strong id="hud-loops">0</strong></div>
      </div>
    </header>

    <div id="view">
      <canvas id="scene" aria-label="Visão em primeira pessoa andando sobre os fios do circuito"></canvas>
      <div id="dpad" role="group" aria-label="Escolha a direção"></div>
      <div id="caption"></div>
    </div>

    <section id="panel" aria-live="polite"></section>

    <footer>
      Você é uma carga positiva andando sobre os fios. Toque nas setas no centro da tela
      (ou use as setas do teclado) para escolher o caminho em cada quina.
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
